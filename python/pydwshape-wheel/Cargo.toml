[package]
name = "pydwshape"
version = "0.4.0"
edition = "2021"
description = "DWriteCore-native per-lookup shaping tracer wheel (Windows only, abi3)"
license = "MIT"

[lib]
name = "_pydwshape"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"] }

# The dwtshape (DWriteCore) engine is Windows-only (loads+hooks DWriteCore).
# Gate it to Windows so the wheel crate also builds on Linux/macOS, where the
# cross-platform Wine DWrite backend (pydwshape/_wine.py) is used instead.
[target.'cfg(windows)'.dependencies]
dwtshape = { path = "../.." }

[profile.release]
opt-level = 3
