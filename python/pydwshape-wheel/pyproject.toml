[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pydwshape"
version = "0.4.0"
description = "DWrite per-lookup OpenType shaping tracer (babelsoft /api/opentype/shape compatible). Native DWriteCore on Windows; cross-platform Wine DWrite port backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["directwrite", "dwritecore", "opentype", "shaping", "babelmap", "wine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Fonts",
]

[tool.maturin]
module-name = "pydwshape._pydwshape"
python-source = "python"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# Bundle the MS-signed DWriteCore.dll (Windows, dwcore backend) and the Wine
# DWrite port shared library (winedwrite.dll / libwinedwrite.so / .dylib).
# Build scripts copy the right library in before `maturin build`.
include = [
    "pydwshape/DWriteCore.dll",
    "pydwshape/NOTICE.md",
    "pydwshape/winedwrite.dll",
    "pydwshape/libwinedwrite.so",
    "pydwshape/libwinedwrite.dylib",
]
