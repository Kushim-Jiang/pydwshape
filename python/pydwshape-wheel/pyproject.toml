[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pydwshape"
version = "0.1.0"
description = "DWriteCore-native per-lookup OpenType shaping tracer (babelsoft /api/opentype/shape compatible). WINDOWS ONLY."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["directwrite", "dwritecore", "opentype", "shaping", "babelmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Fonts",
]

[tool.maturin]
module-name = "pydwshape._pydwshape"
python-source = "python"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# Bundle the MS-signed DWriteCore.dll (+ notice) into the wheel at
# pydwshape/DWriteCore.dll (matched relative to the python-source dir).
include = ["pydwshape/DWriteCore.dll", "pydwshape/NOTICE.md"]
