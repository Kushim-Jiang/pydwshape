[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydwshape"
description = "Windows-only: DirectWrite shaping feature-level trace (feature names + per-lookup glyph snapshots) via Frida, aligned with HarfBuzz stages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pydwshape contributors" }]
keywords = [
    "directwrite",
    "textshaping",
    "shaping",
    "opentype",
    "harfbuzz",
    "mongolian",
    "frida",
    "font",
    "trace",
]
# Windows-only: DirectWrite / TextShaping exist only on Windows and may not be
# redistributed; there is intentionally no cross-platform story.
dependencies = [
    "frida>=15.0; platform_system == 'Windows'",
    "dwriteshapepy>=1.0.10; platform_system == 'Windows'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]

# Single source of truth for the version: src/pydwshape/_version.py
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Kushim-Jiang/pydwshape"
Documentation = "https://github.com/Kushim-Jiang/pydwshape#readme"
Issues = "https://github.com/Kushim-Jiang/pydwshape/issues"

[project.optional-dependencies]
# Install with: uv sync --extra dev   (or pip install -e ".[dev]")
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydwshape = ["agent.js", "rva_registry.json", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pydwshape._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "native: requires frida + dwriteshapepy + a live DirectWrite process (auto-skipped when absent)",
    "golden: requires the hudum.otf Mongolian test font (auto-skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples", "tools"]
extend-exclude = ["tools/ghidra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501 is disabled: `ruff format` is the source of truth for line breaking.
# B008: ctypes callbacks as defaults are intentional where used.
# RUF022: `__all__` is grouped by topic (readability) rather than sorted.
ignore = ["E501", "B008", "RUF022"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
warn_unused_ignores = true

# frida and dwriteshapepy ship no type info / stubs.
[[tool.mypy.overrides]]
module = ["frida.*", "dwriteshapepy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydwshape.worker"]
# ctypes windll attributes are untyped; values are converted at call sites.
disallow_any_expr = false
check_untyped_defs = true
