# Build the Windows-only PyO3 abi3 wheel and publish to PyPI.
#
# Two jobs:
#   1. build-windows : build the win_amd64 abi3 wheel on windows-latest and
#                      upload it as an artifact.
#   2. publish       : publish that artifact to PyPI on ubuntu-latest (the
#                      pypa/gh-action-pypi-publish action is GNU/Linux-only,
#                      e.g. for Sigstore attestations) via OIDC trusted
#                      publishing, from the 'release' environment.
#
# Trigger: push tag `vX.Y.Z` (version in pyproject.toml must match) -> publish.
# Manual run with the dry_run checkbox -> build + artifact only, no publish.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + smoke only; do NOT publish to PyPI"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for PyPI trusted publishing
  attestations: write # PyPI provenance (sigstore)

jobs:
  build-windows:
    name: Build win_amd64 abi3 wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Set up MSYS2 (MinGW gcc for the Wine port)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build Wine DWrite port (winedwrite.dll)
        shell: pwsh
        run: |
          $gcc = 'C:\msys64\mingw64\bin\gcc.exe'
          if (-not (Test-Path $gcc)) {
            $cand = Get-ChildItem 'C:\msys64\mingw64\bin\gcc.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cand) { $gcc = $cand.FullName }
          }
          if (-not (Test-Path $gcc)) { throw 'MSYS2 MinGW gcc not found' }
          Write-Output "gcc: $gcc"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\wine_dwrite\port\build.ps1 -Gcc $gcc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools\wine_dwrite\port\build\winedwrite.dll python\pydwshape-wheel\python\pydwshape\ -Force
          Write-Output 'winedwrite.dll bundled'

      - name: Fetch DWriteCore.dll (Windows App SDK, MS-signed)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $u = 'https://www.nuget.org/api/v2/package/Microsoft.WindowsAppSDK.DWrite/2.1.0'
          Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\dwc.nupkg"
          Copy-Item "$env:TEMP\dwc.nupkg" "$env:TEMP\dwc.zip" -Force
          Expand-Archive -Path "$env:TEMP\dwc.zip" -DestinationPath "$env:TEMP\dwc" -Force
          $dll = Get-ChildItem "$env:TEMP\dwc" -Recurse -Filter 'DWriteCore.dll' |
                 Where-Object { $_.FullName -match 'win-x64' -and $_.FullName -match 'native' } |
                 Select-Object -First 1
          if (-not $dll) { throw 'DWriteCore.dll not found in NuGet package' }
          Copy-Item $dll.FullName 'python\pydwshape-wheel\python\pydwshape\DWriteCore.dll' -Force
          Write-Output "staged $($dll.FullName)"

      - name: Build abi3 wheel
        working-directory: python/pydwshape-wheel
        run: python -m maturin build --release --interpreter python -o dist

      - name: Smoke (both backends + bundled DLLs)
        shell: pwsh
        run: |
          $whl = (Get-ChildItem 'python\pydwshape-wheel\dist\*.whl' | Select-Object -First 1).FullName
          python -m pip install --quiet $whl
          $code = @"
          import pydwshape, os
          p = os.path.dirname(pydwshape.__file__)
          assert os.path.exists(os.path.join(p, 'DWriteCore.dll')), 'DWriteCore.dll missing'
          assert os.path.exists(os.path.join(p, 'winedwrite.dll')), 'winedwrite.dll missing'
          font = open('tools/wine_dwrite/wine-src/dlls/dwrite/tests/wine_test.ttf', 'rb').read()
          r = pydwshape.shape_with_dwrite(font, 'AVATAR', backend='winedwrite')
          assert r['engine'] == 'winedwrite' and r['final'], r
          print('smoke ok:', p)
          "@
          python -c $code

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydwshape-wheel
          path: python/pydwshape-wheel/dist/*.whl

  publish:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    environment: release
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: pydwshape-wheel
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
