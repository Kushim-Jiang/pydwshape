# Build the Windows-only PyO3 abi3 wheel and publish to PyPI.
#
# Two jobs:
#   1. build-windows : build the win_amd64 abi3 wheel on windows-latest and
#                      upload it as an artifact.
#   2. publish       : publish that artifact to PyPI on ubuntu-latest (the
#                      pypa/gh-action-pypi-publish action is GNU/Linux-only,
#                      e.g. for Sigstore attestations) via OIDC trusted
#                      publishing, from the 'release' environment.
#
# Trigger: push tag `vX.Y.Z` (version in pyproject.toml must match) -> publish.
# Manual run with the dry_run checkbox -> build + artifact only, no publish.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + smoke only; do NOT publish to PyPI"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for PyPI trusted publishing
  attestations: write # PyPI provenance (sigstore)

jobs:
  build-windows:
    name: Build win_amd64 abi3 wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Fetch DWriteCore.dll (Windows App SDK, MS-signed)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $u = 'https://www.nuget.org/api/v2/package/Microsoft.WindowsAppSDK.DWrite/2.1.0'
          Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\dwc.nupkg"
          Copy-Item "$env:TEMP\dwc.nupkg" "$env:TEMP\dwc.zip" -Force
          Expand-Archive -Path "$env:TEMP\dwc.zip" -DestinationPath "$env:TEMP\dwc" -Force
          $dll = Get-ChildItem "$env:TEMP\dwc" -Recurse -Filter 'DWriteCore.dll' |
                 Where-Object { $_.FullName -match 'win-x64' -and $_.FullName -match 'native' } |
                 Select-Object -First 1
          if (-not $dll) { throw 'DWriteCore.dll not found in NuGet package' }
          Copy-Item $dll.FullName 'python\pydwshape-wheel\python\pydwshape\DWriteCore.dll' -Force
          Write-Output "staged $($dll.FullName)"

      - name: Build abi3 wheel
        working-directory: python/pydwshape-wheel
        run: python -m maturin build --release --interpreter python -o dist

      - name: Smoke (import + bundled DLL present)
        shell: pwsh
        run: |
          $whl = (Get-ChildItem 'python\pydwshape-wheel\dist\*.whl' | Select-Object -First 1).FullName
          python -m pip install --quiet $whl
          python -c "import pydwshape, os; p = os.path.dirname(pydwshape.__file__); assert os.path.exists(os.path.join(p, 'DWriteCore.dll')), 'DWriteCore.dll missing'; print('smoke ok:', p)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydwshape-wheel
          path: python/pydwshape-wheel/dist/*.whl

  publish:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    environment: release
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: pydwshape-wheel
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
