[package]
name = "dwtshape"
version = "0.4.0"
edition = "2021"
description = "DirectWrite/TextShaping step-by-step shaping tracer (USE order) — babelsoft /api/opentype/shape compatible"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Memory",
] }
serde_json = "1"

[profile.dev]
opt-level = 1

[[bin]]
name = "dwtshape"
path = "src/main.rs"
